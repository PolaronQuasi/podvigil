name: Prepare release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/verify.yml

  draft:
    if: github.server_url == 'https://github.com' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions-${{ github.sha }}
          path: dist/
      - name: Check the tag and release ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python tools/ci.py release-check --tag "$RELEASE_TAG"
          cd dist
          sha256sum --check SHA256SUMS
      - name: Create a draft with the verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "PodVigil $RELEASE_TAG" --notes-file docs/RELEASE-DRAFT.md \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS
