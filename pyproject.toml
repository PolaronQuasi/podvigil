[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# Package, command and per-user folders use the PodVigil name.
[project]
name = "podvigil"
authors = [{ name = "Darius-Nicolae Litescu" }]
dynamic = ["version"]
description = "RunPod GPU job runner with deadlines, independent supervision, automatic cleanup and verified result backups."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "DISCLAIMER.md"]
dependencies = [
  # Only launch and result retrieval need it; planning and the tests use the standard library.
  "boto3>=1.43,<2",
]

[project.scripts]
podvigil = "podvigil.cli:run_cli"

[tool.setuptools.dynamic]
version = { attr = "podvigil.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
